<style>
:root{
  --ink:#3b2f2a; --panel:rgba(255,253,248,.92); --line:#3b2f2a; --btn:#ffe08a; --btn-ink:#3b2f2a; --ring:#2a6fdb;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#f6ead8;--panel:rgba(50,40,36,.92);--line:#f6ead8;--btn:#6b5320;--btn-ink:#fff3d0;--ring:#8fb8ff;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif}
#stage{position:fixed;inset:0}
#stage svg{width:100%;height:100%;display:block;overflow:visible;touch-action:manipulation}
svg .r{cursor:inherit;stroke:#3b2f2a;stroke-width:3;stroke-linejoin:round}

.bar{position:fixed;left:50%;transform:translateX(-50%);width:max-content;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:8px;background:var(--panel);border:2px solid var(--line);border-radius:18px;max-width:calc(100% - 110px)}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:90px;display:flex;justify-content:center;align-items:flex-start;gap:8px;direction:ltr;pointer-events:none}
#top>*{pointer-events:auto}
@media (min-width:700px){#top{left:90px}}
#scenes{position:static;transform:none;max-width:100%;min-width:0;direction:rtl}
#actions{bottom:max(10px,env(safe-area-inset-bottom))}
button{font:inherit;color:var(--btn-ink);background:var(--btn);border:2px solid var(--line);border-radius:14px;padding:4px 16px;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
button.ic{width:54px;height:54px;padding:0;display:grid;place-items:center;border-radius:50%}
button.ic svg{width:38px;height:38px;display:block;pointer-events:none;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.28))}
#erase{background:#ffa94d;color:#33210f}
#erase[aria-pressed="true"]{outline:4px solid var(--ring);outline-offset:2px;transform:scale(1.1)}
#reset{background:#f0605d}
#sound{background:#7ccf6a;width:44px;height:44px;margin-top:15px;flex:none}
#sound svg{width:30px;height:30px;transform:translate(-.55px,-1.25px)}
#sound[aria-pressed="true"] svg{transform:translate(-1.05px,-1.25px)}
#sound[aria-pressed="true"]{background:#c9ced6}
#sound .slash{display:none}
#sound[aria-pressed="true"] .slash{display:inline}
#sound[aria-pressed="true"] .waves{display:none}
#save{background:#6ec9f5;color:#10283a}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* الألوان مرصوصة فوق بعضها على اليمين */
#palette{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--panel);border:2px solid var(--line);border-radius:30px}
.sw{--s:var(--sw,min(44px,calc((100dvh - 90px) / 12)));width:var(--s);height:var(--s);min-height:0;padding:0;border-radius:50%;border:3px solid var(--line)}
.sw[aria-checked="true"]{outline:4px solid var(--ring);outline-offset:2px;transform:scale(1.1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== الواجهة الأولية ===== */
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(165deg,#a9dff7 0%,#cfeffc 48%,#ffdbe9 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3.5vh,26px);padding:24px;
  transition:opacity .45s ease,visibility 0s linear .45s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo{height:min(52vh,380px);width:auto;max-width:82vw;object-fit:contain;display:block;animation:float 2.4s ease-in-out infinite}
#splash .track{direction:rtl;display:flex;width:min(300px,72vw);height:20px;border:3px solid #3b2f2a;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.65)}
#splash .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,#ff9cc6,#ff5fa2);animation:load 5s linear forwards}
@keyframes load{from{width:0}to{width:100%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){#splash .logo{animation:none}}

/* ===== فقاعات التفاعل ===== */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.bub{position:absolute;display:grid;place-items:center;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;
  font-size:calc(var(--s)*.56);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.96) 0,rgba(255,255,255,.6) 26%,rgba(190,228,255,.38) 62%,rgba(255,190,222,.4) 100%);
  border:2px solid rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(60,100,160,.28),inset 0 -5px 9px rgba(120,180,255,.28);
  animation:bubUp 1.5s ease-out var(--d,0s) both}
@keyframes bubUp{
  0%{opacity:0;transform:translate(0,0) scale(.3)}
  14%{opacity:1;transform:translate(calc(var(--dx)*.12),-12px) scale(1.18)}
  26%{opacity:1;transform:translate(calc(var(--dx)*.22),-20px) scale(1)}
  72%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.06)}}
@keyframes bubFade{0%{opacity:0}15%,70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bub{animation-name:bubFade}}
/* وضع الحاسوب: الرسمة تأخذ المساحة الفاضية بين الأزرار فلا تغطيها، ولوحة الألوان تلتصق بالرسمة (المواضع الدقيقة يضبطها layout()) */
@media (min-width:700px){#stage{top:100px;bottom:96px;left:90px;right:90px}}
</style>

const SMILES=["😀","😃","😄","😁","😆","😊","🙂","😍","🥰","🤩","😎","😋"],THUMB="👍";
let lastEmoji="";
function pickEmoji(){
  let e;
  if(Math.random()<.3&&lastEmoji!==THUMB)e=THUMB;
  else do{e=SMILES[Math.random()*SMILES.length|0]}while(e===lastEmoji);
  return lastEmoji=e;
}
function bubble(x,y,o={}){
  const L=$("fx"),b=document.createElement("div"),s=o.size||Math.round(46+Math.random()*16);
  x=Math.min(Math.max(x,s/2+4),innerWidth-s/2-4);y=Math.max(y,s/2+4);
  b.className="bub";b.textContent=o.emoji||pickEmoji();
  b.style.left=x+"px";b.style.top=y+"px";
  b.style.setProperty("--s",s+"px");
  b.style.setProperty("--dx",Math.round((Math.random()-.5)*60)+"px");
  b.style.setProperty("--dy",-Math.round(80+Math.random()*50)+"px");
  b.style.setProperty("--d",(o.delay||0).toFixed(2)+"s");
  L.appendChild(b);
  while(L.children.length>24)L.firstChild.remove();
  const rm=()=>b.remove();b.addEventListener("animationend",rm);
  setTimeout(rm,1500+(o.delay||0)*1000+400);
}
function burst(x,y,n,big){ // عدة فقاعات معاً عند بلوغ ربع/نصف/ثلاثة أرباع الرسمة
  const gap=big?58:50;
  for(let i=0;i<n;i++)
    bubble(x+(i-(n-1)/2)*gap,y-10-Math.random()*30,{emoji:i===1?THUMB:pickEmoji(),size:big?68:58,delay:i*.07});
}
function celebrate(){ // اكتمال الرسمة
  const n=16;
  for(let i=0;i<n;i++)
    bubble(innerWidth*(.06+.88*Math.random()),innerHeight*(.35+.6*Math.random()),
      {emoji:i%4===0?THUMB:pickEmoji(),size:Math.round(58+Math.random()*28),delay:Math.random()*.4});
}
function progressRatio(){
  const rs=document.querySelectorAll("#art .r");let c=0;
  rs.forEach(r=>{if(r.getAttribute("fill")!=="#ffffff")c++});
  return rs.length?c/rs.length:0;
}
function onProgress(ev,r){
  let x=ev.clientX,y=ev.clientY;
  if(!x&&!y){const b=r.getBoundingClientRect();x=b.left+b.width/2;y=b.top+b.height/2}
  const m=Math.floor(progressRatio()*4); // 0..4
  if(m>st.mile){st.mile=m;m===4?celebrate():burst(x,y,5,m===3)}
  else bubble(x,y-18);
}

  scene(){[330,420,540,700].forEach((f,k)=>bloop(f,k*.08,.2));bell(1046.5,.38,.1,.3)}
};

COLORS.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className="sw";b.style.background=c;b.dataset.c=c;b.setAttribute("role","radio");
  b.setAttribute("aria-label","لون "+(i+1));b.setAttribute("aria-checked",i===0);
  b.onclick=()=>{st.color=c;st.ci=i;setErase(false);sfx.pick(i);[...$("palette").children].forEach(x=>x.setAttribute("aria-checked",x===b))};
  $("palette").appendChild(b);
});
Object.keys(SCENES).forEach(n=>{
  const b=document.createElement("button");
  b.className="ic";b.dataset.name=n;b.title=n;b.setAttribute("aria-label",n);
  b.innerHTML=ICONS[n];
  b.onclick=()=>{show(n);sfx.scene()};$("scenes").appendChild(b);
});
function show(name){st.scene=name;st.mile=0;
  
  [...$("scenes").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.name===name));
  $("stage").innerHTML=`<svg id="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="رسمة ${name} للتلوين">${SCENES[name]}</svg>`;
  layout();
  document.querySelectorAll("#art .r").forEach(r=>{
    r.setAttribute("fill","#ffffff");
    r.addEventListener("click",ev=>{const was=r.getAttribute("fill")!=="#ffffff";r.setAttribute("fill",st.erase?"#ffffff":st.color);const bub=st.scene==="السمكة"&&r.tagName==="circle"&&+r.getAttribute("r")<=14;st.erase?sfx.erase():sfx.fill(bub);
      if(!st.erase&&!was&&st.color!=="#ffffff")onProgress(ev,r)});
  });
}
function cursorSvg(){
  const body=st.erase
   ?'<g transform="rotate(-35 16 16)"><rect x="3" y="9" width="26" height="14" rx="3" fill="#3f86da" stroke="#3b2f2a" stroke-width="1.2"/><rect x="3" y="9" width="15" height="14" rx="3" fill="#f08aa8" stroke="#3b2f2a" stroke-width="1.2"/></g>'
   :'<path d="M28 4L14 18" stroke="#c98a4b" stroke-width="4.5" stroke-linecap="round"/><path d="M14.5 17.5L10.5 21.5" stroke="#b8c0cc" stroke-width="5.5"/><path d="M8.2 20.2L12.8 24.8Q10.5 30.5 3 29Q3.5 24 8.2 20.2z" fill="'+st.color+'" stroke="#3b2f2a" stroke-width="1.2" stroke-linejoin="round"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">'+body+'</svg>';
}
function updateCursor(){
  const hot=st.erase?"9 29":"3 29";
  $("stage").style.cursor='url("data:image/svg+xml,'+encodeURIComponent(cursorSvg())+'") '+hot+', '+(st.erase?"cell":"crosshair");
}
function setErase(on){st.erase=on;updateCursor();$("erase").setAttribute("aria-pressed",on);
  if(on)[...$("palette").children].forEach(x=>x.setAttribute("aria-checked",false));
  else [...$("palette").children].forEach(x=>x.setAttribute("aria-checked",x.style.background===""?false:x.dataset.c===st.color))}
$("erase").onclick=()=>{setErase(!st.erase);sfx.tool(st.erase)};
$("reset").onclick=()=>{sfx.reset();st.mile=0;document.querySelectorAll("#art .r").forEach(r=>r.setAttribute("fill","#ffffff"))};
let saveNoMem=0;
function nextSaveNo(){ // رقم تسلسلي يبقى محفوظاً بين مرات فتح اللعبة
  let n;
  try{n=(parseInt(localStorage.getItem("saveNo"),10)||0)+1;localStorage.setItem("saveNo",n)}
  catch(e){n=++saveNoMem}
  return n;
}
$("save").onclick=()=>{sfx.save();
  const svg=$("art").cloneNode(true);
  svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
  svg.setAttribute("width","1200");svg.setAttribute("height","900");
  svg.querySelectorAll(".r").forEach(r=>{r.setAttribute("stroke","#3b2f2a");r.setAttribute("stroke-width","3");r.setAttribute("stroke-linejoin","round")});
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");c.width=1200;c.height=900;
    c.getContext("2d").drawImage(img,0,0,1200,900);
    const name="تلويناتي "+nextSaveNo()+".png";
    c.toBlob(blob=>{
      const url=URL.createObjectURL(blob),a=document.createElement("a");
      a.download=name;a.href=url;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    },"image/png");
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(svg));
};
function setMuted(m){
  muted=m;try{localStorage.setItem("muted",m?"1":"0")}catch(e){}
  const b=$("sound"),t=m?"تشغيل الصوت":"كتم الصوت";
  b.setAttribute("aria-pressed",m);b.setAttribute("aria-label",t);b.title=t;
}
$("sound").onclick=()=>{setMuted(!muted);if(!muted)sfx.pick(7)};
setMuted(muted);
/* حدود الرسمة الفعلية بوحدات الـviewBox (نتجاهل مستطيلات الخلفية الضخمة)؛ نقيسها وهي بوضعها الأساسي */
function contentBox(art){
  art.removeAttribute("style");
  const sr=art.getBoundingClientRect(),k0=Math.min(sr.width/400,sr.height/300),
    ox=sr.left+(sr.width-400*k0)/2,oy=sr.top+(sr.height-300*k0)/2;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  [...art.children].forEach(e=>{const b=e.getBoundingClientRect();
    if(!b.width&&!b.height)return;
    if(b.width/k0>420||b.height/k0>320)return;
    x0=Math.min(x0,(b.left-ox)/k0);y0=Math.min(y0,(b.top-oy)/k0);
    x1=Math.max(x1,(b.right-ox)/k0);y1=Math.max(y1,(b.bottom-oy)/k0)});
  if(x1<x0)return{x0:0,y0:0,x1:400,y1:300};
  return{x0,y0,x1,y1};
}
/* وضع الحاسوب: كل رسمة تتوسّط وتتكبّر بحسب حجمها الفعلي بين الشريطين، ولوحة الألوان تلتصق بحافتها اليمنى، والمجموعة كلها في منتصف الشاشة */
function layout(){
  const stg=$("stage"),pal=$("palette"),art=$("art");
  if(innerWidth<700){stg.removeAttribute("style");if(art)art.removeAttribute("style");
    pal.style.left=pal.style.right=pal.style.top="";pal.style.removeProperty("--sw");return}
  const gap=12,tb=$("top").getBoundingClientRect().bottom,ab=$("actions").getBoundingClientRect().top;
  stg.style.top=(tb+gap)+"px";stg.style.bottom=Math.max(0,innerHeight-ab+gap)+"px";stg.style.left=stg.style.right="0px";
  if(!art)return;
  const r=stg.getBoundingClientRect();
  /* دوائر الألوان تصغر عند الحاجة لتبقى اللوحة بين الشريطين العلوي والسفلي */
  pal.style.setProperty("--sw",Math.max(26,Math.min(44,Math.floor((r.height-86)/12)))+"px");
  const bx=contentBox(art),pad=4,cw=bx.x1-bx.x0+2*pad,ch=bx.y1-bx.y0+2*pad,
    g=18,pw=pal.offsetWidth,ph=pal.offsetHeight,
    k=Math.min((innerWidth-pw-g-40)/cw,(r.height-8)/ch),
    gl=(innerWidth-(cw*k+g+pw))/2;
  art.style.cssText="position:absolute;width:"+400*k+"px;height:"+300*k+"px;left:"+(gl-(bx.x0-pad)*k)+"px;top:"+((r.height-ch*k)/2-(bx.y0-pad)*k)+"px";
  pal.style.right="auto";
  pal.style.left=(gl+cw*k+g)+"px";
  pal.style.top=Math.max(ph/2+8,Math.min(r.top+r.height/2,innerHeight-ph/2-8))+"px";
}
addEventListener("resize",layout);
show("البيت");layout();updateCursor();
// تسجيل خدمة العمل (تعمل فقط عند التشغيل من موقع http/https)
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
